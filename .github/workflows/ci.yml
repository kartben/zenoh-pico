name: CI

on:
  push:
    branches: ["main", "release/*", "!release/dry-run/*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-only base branch of the fork: run nothing but the Zephyr builds, so that
# pull requests against it do not spend runners on the other platforms.
jobs:
  zephyr:
    name: Build Zephyr
    uses: ./.github/workflows/zephyr.yaml
